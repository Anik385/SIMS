<app-navbar></app-navbar>
<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>🚚 Suppliers</h2>
    <button class="btn btn-primary" (click)="openAdd()">+ Add Supplier</button>
  </div>

  <table class="table table-striped table-hover">
    <thead>
      <tr>
        <th>ID</th><th>Name</th><th>Contact</th><th>Email</th>
        <th>Phone</th><th>Status</th><th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let s of suppliers">
        <td>{{ s.id }}</td>
        <td>{{ s.name }}</td>
        <td>{{ s.contactPerson }}</td>
        <td>{{ s.email }}</td>
        <td>{{ s.phone }}</td>
        <td>
          <span class="badge" [ngClass]="s.isActive ? 'bg-success' : 'bg-secondary'">
            {{ s.isActive ? 'Active' : 'Inactive' }}
          </span>
        </td>
        <td>
          <button class="btn btn-sm btn-warning me-1" (click)="openEdit(s)">Edit</button>
          <button class="btn btn-sm btn-danger" (click)="delete(s)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<app-supplier-modal
  *ngIf="showModal"
  [supplier]="selected"
  (save)="handleSave($event)"
  (close)="close()">
</app-supplier-modal>
