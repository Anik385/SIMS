<app-navbar></app-navbar>
<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>📄 Purchase Orders</h2>
    <button class="btn btn-primary" (click)="openAdd()">+ New Purchase Order</button>
  </div>

  <table class="table table-striped table-hover">
    <thead>
      <tr>
        <th>Order #</th><th>Supplier</th><th>Status</th>
        <th>Total</th><th>Expected</th><th>Created</th><th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let o of orders">
        <td>{{ o.orderNumber }}</td>
        <td>{{ o.supplierName }}</td>
        <td><span class="badge" [ngClass]="getStatusClass(o.status)">{{ o.status }}</span></td>
        <td>${{ o.totalAmount }}</td>
        <td>{{ o.expectedDelivery | date:'short' }}</td>
        <td>{{ o.createdAt | date:'short' }}</td>
        <td>
          <button class="btn btn-sm btn-info me-1" *ngIf="o.status === 'DRAFT'"
                  (click)="updateStatus(o, 'APPROVED')">Approve</button>
          <button class="btn btn-sm btn-success me-1" *ngIf="o.status === 'APPROVED'"
                  (click)="updateStatus(o, 'RECEIVED')">Receive</button>
          <button class="btn btn-sm btn-danger" *ngIf="o.status !== 'RECEIVED'"
                  (click)="delete(o)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<app-po-modal
  *ngIf="showModal"
  (save)="handleCreate($event)"
  (close)="close()">
</app-po-modal>
