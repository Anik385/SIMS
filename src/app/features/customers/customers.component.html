<app-navbar></app-navbar>
<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>👥 Customers</h2>
    <button class="btn btn-primary" (click)="openAdd()">+ Add Customer</button>
  </div>

  <table class="table table-striped table-hover">
    <thead>
      <tr><th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Loyalty</th><th>Status</th><th>Actions</th></tr>
    </thead>
    <tbody>
      <tr *ngFor="let c of customers">
        <td>{{ c.id }}</td>
        <td>{{ c.name }}</td>
        <td>{{ c.email }}</td>
        <td>{{ c.phone }}</td>
        <td>{{ c.loyaltyPoints }} pts</td>
        <td>
          <span class="badge" [ngClass]="c.isActive ? 'bg-success' : 'bg-secondary'">
            {{ c.isActive ? 'Active' : 'Inactive' }}
          </span>
        </td>
        <td>
          <button class="btn btn-sm btn-warning me-1" (click)="openEdit(c)">Edit</button>
          <button class="btn btn-sm btn-danger" (click)="delete(c)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<app-customer-modal
  *ngIf="showModal"
  [customer]="selected"
  (save)="handleSave($event)"
  (close)="close()">
</app-customer-modal>
