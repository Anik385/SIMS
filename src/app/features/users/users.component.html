<app-navbar></app-navbar>
<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>👥 User Management</h2>
    <button class="btn btn-primary" (click)="openAddModal()">+ Add User</button>
  </div>

  <table class="table table-striped table-hover">
    <thead>
      <tr>
        <th>ID</th>
        <th>Full Name</th>
        <th>Email</th>
        <th>Role</th>
        <th>Created</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let u of users">
        <td>{{ u.id }}</td>
        <td>{{ u.fullName }}</td>
        <td>{{ u.email }}</td>
        <td>
          <span class="badge"
                [ngClass]="{
                  'bg-danger': u.role === 'ADMIN',
                  'bg-warning text-dark': u.role === 'MANAGER',
                  'bg-info text-dark': u.role === 'STAFF',
                  'bg-secondary': u.role === 'VIEWER'
                }">
            {{ u.role }}
          </span>
        </td>
        <td>{{ u.createdAt | date:'short' }}</td>
        <td>
          <button class="btn btn-sm btn-warning me-1" (click)="openEditModal(u)">Edit</button>
          <button class="btn btn-sm btn-danger" (click)="deleteUser(u)">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>

<app-user-modal
  *ngIf="showModal"
  [user]="selectedUser"
  (save)="handleSave($event)"
  (close)="closeModal()">
</app-user-modal>
