<div class="container">
  <div class="row justify-content-center mt-5">
    <div class="col-md-4">
      <div class="card shadow">
        <div class="card-body">
          <h3 class="text-center mb-4">SIMS Login</h3>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input class="form-control" [(ngModel)]="email" placeholder="admin@sims.com" />
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input class="form-control" type="password" [(ngModel)]="password" placeholder="admin123" (keyup.enter)="login()" />
          </div>
          <button class="btn btn-primary w-100" (click)="login()" [disabled]="loading">
            {{ loading ? 'Logging in...' : 'Login' }}
          </button>
          <div *ngIf="error" class="alert alert-danger mt-3">{{ error }}</div>
        </div>
      </div>
    </div>
  </div>
</div>
