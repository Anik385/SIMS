<div class="modal show d-block" style="background: rgba(0,0,0,0.5);">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">{{ isEdit ? 'Edit Supplier' : 'Add Supplier' }}</h5>
        <button class="btn-close" (click)="cancel()"></button>
      </div>
      <div class="modal-body">
        <div class="mb-2"><label>Name</label>
          <input class="form-control" [(ngModel)]="form.name" /></div>
        <div class="mb-2"><label>Contact Person</label>
          <input class="form-control" [(ngModel)]="form.contactPerson" /></div>
        <div class="mb-2"><label>Email</label>
          <input class="form-control" type="email" [(ngModel)]="form.email" /></div>
        <div class="mb-2"><label>Phone</label>
          <input class="form-control" [(ngModel)]="form.phone" /></div>
        <div class="mb-2"><label>Address</label>
          <input class="form-control" [(ngModel)]="form.address" /></div>
        <div class="form-check mb-2">
          <input class="form-check-input" type="checkbox" [(ngModel)]="form.isActive" id="active" />
          <label class="form-check-label" for="active">Active</label>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" (click)="cancel()">Cancel</button>
        <button class="btn btn-primary" (click)="submit()">
          {{ isEdit ? 'Update' : 'Create' }}
        </button>
      </div>
    </div>
  </div>
</div>
