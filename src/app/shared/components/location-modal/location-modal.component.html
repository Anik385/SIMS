<div class="modal show d-block" style="background: rgba(0,0,0,0.5);">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">{{ isEdit ? 'Edit Location' : 'Add Location' }}</h5>
        <button class="btn-close" (click)="cancel()"></button>
      </div>
      <div class="modal-body">
        <div class="mb-2">
          <label>Aisle</label>
          <input class="form-control" [(ngModel)]="aisle" placeholder="A" />
        </div>
        <div class="mb-2">
          <label>Shelf</label>
          <input class="form-control" [(ngModel)]="shelf" placeholder="1" />
        </div>
        <div class="mb-2">
          <label>Bin</label>
          <input class="form-control" [(ngModel)]="bin" placeholder="B-12" />
        </div>
        <div class="mb-2">
          <label>Description</label>
          <input class="form-control" [(ngModel)]="description" placeholder="Optional" />
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" (click)="cancel()">Cancel</button>
        <button class="btn btn-primary" (click)="submit()">
          {{ isEdit ? 'Update' : 'Create' }}
        </button>
      </div>
    </div>
  </div>
</div>
