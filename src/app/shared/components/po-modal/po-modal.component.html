<div class="modal show d-block" style="background: rgba(0,0,0,0.5);">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">New Purchase Order</h5>
        <button class="btn-close" (click)="cancel()"></button>
      </div>

      <div class="modal-body">
        <div class="mb-2">
          <label>Supplier</label>
          <select class="form-select" [(ngModel)]="supplierId">
            <option [ngValue]="null">-- Select Supplier --</option>
            <option *ngFor="let s of suppliers" [ngValue]="s.id">{{ s.name }}</option>
          </select>
        </div>

        <div class="mb-2">
          <label>Expected Delivery</label>
          <input type="datetime-local" class="form-control" [(ngModel)]="expectedDelivery" />
        </div>

        <div class="mb-2">
          <label>Notes</label>
          <textarea class="form-control" [(ngModel)]="notes" rows="2"></textarea>
        </div>

        <h5>Items</h5>
        <table class="table table-sm">
          <thead>
            <tr><th>Product</th><th>Qty</th><th>Unit Price</th><th>Subtotal</th><th></th></tr>
          </thead>
          <tbody>
            <tr *ngFor="let item of items; let i = index">
              <td>
                <select class="form-select form-select-sm" [(ngModel)]="item.productId">
                  <option [ngValue]="0">-- Select --</option>
                  <option *ngFor="let p of products" [ngValue]="p.id">
                    {{ p.name }} ({{ p.sku }})
                  </option>
                </select>
              </td>
              <td><input class="form-control form-control-sm" type="number" min="1" [(ngModel)]="item.quantity" /></td>
              <td><input class="form-control form-control-sm" type="number" [(ngModel)]="item.unitPrice" /></td>
              <td>${{ (item.unitPrice || 0) * item.quantity }}</td>
              <td><button class="btn btn-sm btn-danger" (click)="removeItem(i)">×</button></td>
            </tr>
          </tbody>
        </table>

        <button class="btn btn-sm btn-outline-primary" (click)="addItem()">+ Add Item</button>

        <div class="mt-3 text-end">
          <strong>Total: ${{ total }}</strong>
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" (click)="cancel()">Cancel</button>
        <button class="btn btn-primary" (click)="submit()">Create Purchase Order</button>
      </div>
    </div>
  </div>
</div>
