<div class="modal show d-block" style="background: rgba(0,0,0,0.5);">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">New Sale</h5>
        <button class="btn-close" (click)="cancel()"></button>
      </div>

      <div class="modal-body">
        <div class="row">
          <div class="col-md-6 mb-2">
            <label>Customer (optional)</label>
            <select class="form-select" [(ngModel)]="customerId">
              <option [ngValue]="null">-- Walk-in Customer --</option>
              <option *ngFor="let c of customers" [ngValue]="c.id">{{ c.name }}</option>
            </select>
          </div>
          <div class="col-md-6 mb-2">
            <label>Payment Method</label>
            <select class="form-select" [(ngModel)]="paymentMethod">
              <option *ngFor="let p of paymentMethods" [value]="p">{{ p }}</option>
            </select>
          </div>
        </div>

        <h5 class="mt-3">Items</h5>
        <table class="table table-sm">
          <thead>
            <tr><th>Product</th><th>Stock</th><th>Qty</th><th>Price</th><th>Subtotal</th><th></th></tr>
          </thead>
          <tbody>
            <tr *ngFor="let item of items; let i = index">
              <td>
                <select class="form-select form-select-sm" [(ngModel)]="item.productId">
                  <option [ngValue]="0">-- Select --</option>
                  <option *ngFor="let p of products" [ngValue]="p.id">
                    {{ p.name }} ({{ p.sku }})
                  </option>
                </select>
              </td>
              <td>{{ getStock(item.productId) }}</td>
              <td><input class="form-control form-control-sm" type="number" min="1" [(ngModel)]="item.quantity" /></td>
              <td><input class="form-control form-control-sm" type="number" [(ngModel)]="item.unitPrice" /></td>
              <td>${{ (item.unitPrice || 0) * item.quantity }}</td>
              <td><button class="btn btn-sm btn-danger" (click)="removeItem(i)">×</button></td>
            </tr>
          </tbody>
        </table>

        <button class="btn btn-sm btn-outline-primary" (click)="addItem()">+ Add Item</button>

        <div class="row mt-3">
          <div class="col-md-4"><label>Discount</label>
            <input class="form-control" type="number" [(ngModel)]="discount" /></div>
          <div class="col-md-4"><label>Tax</label>
            <input class="form-control" type="number" [(ngModel)]="tax" /></div>
          <div class="col-md-4"><label>Notes</label>
            <input class="form-control" [(ngModel)]="notes" /></div>
        </div>

        <div class="mt-3 text-end">
          <div>Subtotal: ${{ subtotal }}</div>
          <div>Total: <strong>${{ total }}</strong></div>
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" (click)="cancel()">Cancel</button>
        <button class="btn btn-primary" (click)="submit()">Complete Sale</button>
      </div>
    </div>
  </div>
</div>
